
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameZone - Videojuegos</title>
    <link rel="stylesheet" href="estilos.css">
</head>

<body>

    <header>
        <h1>🎮 GameZone</h1>
        <p>Mi colección de videojuegos favoritos</p>
    </header>

    <main>
        <h2>Lista de videojuegos</h2>

        <table id="tablaJuegos">

            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Compañía</th>
                    <th>Plataforma</th>
                    <th>Valoración</th>
                    <th>Precio</th>
                </tr>
            </thead>

            <tbody id="cuerpoTabla">
                <!-- JavaScript añadirá los videojuegos -->
            </tbody>

        </table>
        
<h2>Añadir un nuevo videojuego</h2>

<form id="formularioJuego">

    <label for="nombre">Nombre del videojuego:</label>
    <input type="text" id="nombre" required>

    <br><br>

    <label for="compania">Compañía:</label>
    <input type="text" id="compania" required>

    <br><br>

    <label for="plataforma">Plataforma:</label>
    <select id="plataforma" required>
        <option value="">Selecciona una plataforma</option>
        <option value="PC">PC</option>
        <option value="PS5">PS5</option>
        <option value="Xbox">Xbox</option>
        <option value="Nintendo Switch">Nintendo Switch</option>
    </select>

    <br><br>

    <label for="valoracion">Valoración (0-10):</label>
    <input type="number" id="valoracion" min="0" max="10" step="0.1" required>

    <br><br>

    <label for="precio">Precio (€):</label>
    <input type="number" id="precio" min="0" step="0.01" required>

    <br><br>

    <button type="submit" id="botonAnadir">
        Añadir juego
    </button>

</form>
    </main>

    <footer>
        <p>Trabajo 02 - DWEC | 2º DAW</p>
        <p>Creado por Sergio 🎮</p>
    </footer>

    <script src="trabajo2.js"></script>
    <script src="reto2.js"></script>

</body>

</html>
